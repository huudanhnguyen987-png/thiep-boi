<title>Thiệp mời đầy tháng bé Khánh Vy (Bối)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,500;0,700;1,500&display=swap">
<style>
:root {
  --paper: #fdeff3; --paper-deep: #f8d3df; --card: #ffffff; --ink: #5c1235;
  --rose: #b0185a; --rose-soft: #e86a9a; --gold: #c9973a; --petal: #f7a8c4;
  --shadow: rgba(140, 30, 80, .22);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #2a0f1d; --paper-deep: #3b1529; --card: #46192f; --ink: #fde3ec;
    --rose: #ff9cc0; --rose-soft: #e86a9a; --gold: #e6bd6a; --petal: #d9739c;
    --shadow: rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #2a0f1d; --paper-deep: #3b1529; --card: #46192f; --ink: #fde3ec;
  --rose: #ff9cc0; --rose-soft: #e86a9a; --gold: #e6bd6a; --petal: #d9739c;
  --shadow: rgba(0, 0, 0, .45);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; overflow-x: hidden; color: var(--ink);
  background: radial-gradient(circle at 50% 0%, var(--paper) 0%, var(--paper-deep) 100%) var(--paper);
  font-family: "Lora", Georgia, "Times New Roman", serif; line-height: 1.6;
}
.script { font-family: "Dancing Script", "Brush Script MT", cursive; }
button, a.button {
  font: inherit; font-weight: 700; color: var(--card); background: var(--rose); border: 0;
  border-radius: 999px; padding: .8rem 1.6rem; cursor: pointer; text-decoration: none; display: inline-block;
}
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* Màn hình phong bì */
.cover {
  position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center;
  gap: 1.6rem; padding: 1.5rem; text-align: center; background: inherit; transition: opacity .7s ease 1.3s, visibility 0s 2s;
}
.cover h1 { margin: 0; font-size: clamp(2rem, 9vw, 3rem); color: var(--rose); font-weight: 700; line-height: 1.2; }
.cover p { margin: 0; }
.envelope { position: relative; width: min(78vw, 320px); aspect-ratio: 3 / 2; perspective: 900px; }
.envelope .back, .envelope .front { position: absolute; inset: 0; border-radius: 10px; }
.envelope .back { background: var(--rose-soft); box-shadow: 0 18px 40px var(--shadow); }

.envelope .front { background: var(--petal); clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
.envelope .flap {
  position: absolute; inset: 0 0 auto 0; height: 60%; background: var(--rose-soft); filter: brightness(.94);
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s ease; z-index: 2;
}
.envelope .seal {
  position: absolute; left: 50%; top: 52%; translate: -50% -50%; z-index: 3; width: 3.4rem; height: 3.4rem;
  padding: 0; font-size: 1.5rem; box-shadow: 0 4px 10px var(--shadow); transition: opacity .3s;
}
.opened .cover { opacity: 0; visibility: hidden; }
.opened .flap { transform: rotateX(180deg); z-index: 0; }
.opened .letter { transform: translateY(-62%); }
.opened .seal { opacity: 0; }

/* Nội dung thiệp */
main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; text-align: center; position: relative; z-index: 1; }
.invite { width: 100%; max-width: 100%; height: auto; border-radius: 14px; box-shadow: 0 16px 40px var(--shadow); display: block; }
.opened .invite { animation: rise .9s ease 1.5s both; }
@keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.96); } }
h2 { font-size: 2rem; color: var(--rose); margin: 2.2rem 0 .6rem; font-weight: 700; }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; margin: 0; padding: 0; list-style: none; }
.countdown li { background: var(--card); border-radius: 12px; padding: .7rem .2rem; box-shadow: 0 6px 16px var(--shadow); }
.countdown b { display: block; font-size: 1.8rem; color: var(--rose); line-height: 1.1; font-variant-numeric: tabular-nums; }
.countdown span { font-size: .85rem; }
.details { margin: 1.2rem 0 1.4rem; }
.details strong { color: var(--rose); }
.closing { font-size: 1.6rem; color: var(--rose); margin-top: 2rem; }

/* Cánh hoa rơi */
.petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.petals i {
  position: absolute; top: -5%; left: var(--x); width: var(--s); height: calc(var(--s) * .6); background: var(--petal);
  border-radius: 80% 20% 80% 20%; opacity: .75; animation: fall var(--d) linear var(--w) infinite;
}
@keyframes fall { to { transform: translate(var(--drift), 112vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  .petals { display: none; }
  .cover, .envelope *, .opened .invite { transition: none; animation: none; }
}
</style>

function scatterPetals(count) {
  /* Tạo các cánh hoa với vị trí, kích thước và tốc độ ngẫu nhiên. */
  const box = document.getElementById("petals");

  }
  for (const [unit, size] of Object.entries(UNITS)) {
    document.querySelector(`[data-unit="${unit}"]`).textContent = Math.floor(left / size);
    left %= size;
  }
}

document.getElementById("open").addEventListener("click", openInvite);
scatterPetals(18);
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
